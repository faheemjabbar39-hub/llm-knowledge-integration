[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kis"
version = "0.1.0"
description = "Controlled comparison of Base, QLoRA, RAG and CAG knowledge-integration strategies for LLMs in asset management"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
